syntax = "proto3";

package le0x.v1;

option go_package = "github.com/le0xdon/le0xfarm/proto/le0x/v1;le0xv1";

import "google/protobuf/timestamp.proto";

// Versions are independent. IDs are opaque strings, validated at the domain boundary.
message AgentHello {
  uint32 protocol_version = 1;
  uint32 schema_version = 2;
  string agent_id = 3;
  string host_id = 4;
  string hostname = 5;
  string enrollment_token = 6;
  bytes certificate_request_der = 7;
}

message ControllerHello {
  uint32 protocol_version = 1;
  uint32 schema_version = 2;
  string controller_id = 3;
  string farm_id = 4;
  bytes agent_certificate_der = 5;
  bytes farm_ca_certificate_der = 6;
}

message Heartbeat {
  google.protobuf.Timestamp timestamp = 1;
  uint64 observed_state_revision = 2;
}

// Pong echoes the nonce byte-for-byte; it is not an authentication mechanism.
message Ping {
  bytes nonce = 1;
}

message Pong {
  bytes nonce = 1;
}

message GetStatus {}
message GetInventory {}

message ExecutionPlan {
  string execution_id = 1;
  string executable = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
  string working_directory = 5;
  string restart_policy = 6;
  MinerSpec miner = 7;
  WorkloadOwnership ownership = 8;
}
message ResourceClaim {
  bool cpu = 1;
  repeated string device_ids = 2;
}
message WorkloadOwnership {
  string workload_id = 1;
  uint64 desired_generation = 2;
  string resolved_hash = 3;
  string host_id = 4;
  ResourceClaim resource_claim = 5;
}
message MinerSpec {
  string adapter_id = 1;
  uint32 spec_version = 2;
  string package_id = 3;
  string package_version = 4;
  string mode = 5;
  string coin = 6;
  string algorithm = 7;
  reserved 8, 9, 10, 16, 17;
  optional uint32 cpu_threads = 11;
  repeated string gpu_device_ids = 12;
  optional bool huge_pages = 13;
  optional bool msr = 14;
  map<string, string> options = 15;
  MiningEndpoint endpoint = 18;
  repeated GPUAssignment gpu_assignments = 19;
}
message GPUAssignment {
  string device_id = 1;
  string hardware_identity = 2;
  string runtime_selector = 3;
}
// Resolved transient pool connection data. Password is potentially sensitive
// and must never be logged or persisted by the command transport.
message MiningEndpoint {
  string address = 1;
  bool tls = 2;
  string user = 3;
  string password = 4;
  string worker = 5;
}
message StartExecution { ExecutionPlan plan = 1; }
message StopExecution { string execution_id = 1; }
message RestartExecution { string execution_id = 1; }
message GetExecutions {}
message Execution {
  string execution_id = 1;
  string state = 2;
  int64 pid = 3;
  google.protobuf.Timestamp started_at = 4;
  int32 exit_code = 5;
  bool has_exit_code = 6;
  uint32 restart_count = 7;
  string last_error = 8;
  MinerTelemetry miner_telemetry = 9;
  repeated string warnings = 10;
  WorkloadOwnership ownership = 11;
}
message DeviceHashrate { string device_id = 1; double hashrate_hps = 2; }
message MinerTelemetry {
  string adapter_id = 1;
  string miner_version = 2;
  string algorithm = 3;
  optional double hashrate_short_hps = 4;
  optional double hashrate_medium_hps = 5;
  optional double hashrate_long_hps = 6;
  optional double highest_hashrate_hps = 7;
  repeated DeviceHashrate per_device = 8;
  optional uint64 accepted_shares = 9;
  optional uint64 rejected_shares = 10;
  optional uint64 stale_shares = 11;
  optional uint64 total_results = 12;
  optional bool pool_connected = 13;
  optional uint32 pool_latency_ms = 14;
  uint64 uptime_seconds = 15;
  optional bool huge_pages_available = 16;
  optional double huge_pages_percent = 17;
  optional bool msr_available = 18;
  google.protobuf.Timestamp collected_at = 19;
  uint64 age_milliseconds = 20;
  string health = 21;
  string error_code = 22;
  string message = 23;
}
message ExecutionResult { Execution execution = 1; string message = 2; }
message Executions { repeated Execution executions = 1; }

// The agent state vocabulary is not yet defined in M0.2.
message Status {
  string agent_state = 1;
  string message = 2;
}

// Physical facts only. This is deliberately a subset of domain Inventory.
message Inventory {
  string host_id = 1;
  string hostname = 2;
  string os_id = 3;
  string os_version = 4;
  string architecture = 5;
  string cpu_vendor = 6;
  string cpu_model = 7;
  uint32 cpu_cores = 8;
  uint32 cpu_threads = 9;
  repeated GPU gpus = 10;
  uint64 memory_total_bytes = 11;
}

message GPU {
  string device_id = 1;
  string vendor = 2;
  string model = 3;
  string pci_bus_id = 4;
  string uuid = 5; // Empty when unavailable.
}

message TypedError {
  string code = 1; // Canonical internal/farmerr code, not a human message.
  string human_message = 2;
  map<string, string> details = 3;
  string suggested_fix = 4;
  string logs_ref = 5;
}

message CommandEnvelope {
  string command_id = 1; // Opaque correlation ID, echoed in CommandResult.
  oneof command {
    Ping ping = 2;
    GetStatus get_status = 3;
    GetInventory get_inventory = 4;
    StartExecution start_execution = 5;
    StopExecution stop_execution = 6;
    RestartExecution restart_execution = 7;
    GetExecutions get_executions = 8;
  }
}

message CommandResult {
  string command_id = 1;
  oneof result {
    Pong pong = 2;
    Status status = 3;
    Inventory inventory = 4;
    TypedError error = 5;
    ExecutionResult execution = 6;
    Executions executions = 7;
  }
}

message AgentMessage {
  oneof payload {
    AgentHello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult command_result = 3;
  }
}

message ControllerMessage {
  oneof payload {
    ControllerHello hello = 1;
    CommandEnvelope command = 2;
  }
}

// Agent initiates the bidirectional stream to its authoritative Controller.
// M1.5 uses this stream over TLS 1.3 with mutual TLS after enrollment.
service AgentControl {
  rpc Connect(stream AgentMessage) returns (stream ControllerMessage);
}
